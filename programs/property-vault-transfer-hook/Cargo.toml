[package]
name = "property-vault-transfer-hook"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "property_vault_transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "property-vault/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"
anchor-spl = "=1.2.0"
property-vault = { path = "../property-vault", features = ["no-entrypoint"] }
spl-discriminator = "=0.5.2"
spl-transfer-hook-interface = "=2.1.0"
spl-tlv-account-resolution = "=0.11.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
